name: bump-landin

# Follows Landin's releases: when a newer one exists, point the formula at
# it and commit. Run it by hand right after a release to skip the wait.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Release to point at (default: the latest)"
        required: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the formula
        id: bump
        env:
          VERSION: ${{ inputs.version }}
        run: echo "version=$(python3 scripts/bump-landin.py $VERSION)" >> "$GITHUB_OUTPUT"
      - name: Commit
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Landin formula $VERSION"
          git push
